<div class="bar">
  <div class="bar-title"><span>$fan_title</span><small>$fan_subtitle</small></div>
  <nav class="tabs" aria-label="$tabs_label"><a href="tree.html">$tab_tree</a><a href="fan.html" aria-current="page">$tab_fan</a></nav>
</div>

<div class="viewport fan-surface" id="viewport" tabindex="0" role="region" aria-label="$fan_surface_label">
  <svg class="fan" id="fan" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<aside class="fan-legend" id="legend" aria-label="$fan_legend"></aside>

<div class="tools" role="toolbar" aria-label="$tools_label">
  <button type="button" id="b-plus" title="$zoom_in" aria-label="$zoom_in">+</button>
  <button type="button" id="b-minus" title="$zoom_out" aria-label="$zoom_out">−</button>
  <button type="button" id="b-center" title="$center_title" class="text">⌂ $center</button>
</div>
<p class="page-sources">$sources · $fan_note</p>
